  </circle>
  
  <circle cx="950" cy="120" r="160" fill="#22D3EE" opacity=".35" filter="url(#blur)">
    <animate attributeName="cx" values="950;890;950" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;160;120" dur="14s" repeatCount="indefinite"/>
