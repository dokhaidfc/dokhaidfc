<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A17"/><stop offset="1" stop-color="#0E1834"/></linearGradient>
  <clipPath id="round"><rect width="1200" height="470" rx="22"/></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1" opacity=".55"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="12s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="1200" height="470" fill="url(#fade)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style>
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  
</style>
<g clip-path="url(#round)">
  <rect width="1200" height="470" fill="url(#bg)"/>
  <rect width="1200" height="470" fill="url(#grid)" mask="url(#gridMask)"/>
  
  <circle cx="600" cy="235" r="200" fill="#3B82F6" opacity=".35" filter="url(#blur)">
    <animate attributeName="cx" values="600;600;600" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="235;235;235" dur="10s" repeatCount="indefinite"/>
  </circle><g class="up" style="animation-delay:0.15s">
      <rect x="45" y="30" width="360" height="190" rx="16" fill="#0B1226" fill-opacity=".85" stroke="#1E293B"/>
      <rect x="45" y="30" width="360" height="190" rx="16" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="140 1100" stroke-linecap="round" opacity=".9">
        <animate attributeName="stroke-dashoffset" from="0" to="-1240" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="73" y="56" width="52" height="40" rx="10" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".5"/>
      <text x="99" y="81" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22D3EE" text-anchor="middle">API</text>
      <text x="141" y="82" font-size="20" font-weight="700" fill="#E2E8F0">Backend &amp; APIs</text>
      <text x="73" y="134" font-size="15" fill="#94A3B8"><tspan x="73" dy="0">Contract-first REST endpoints on the</tspan><tspan x="73" dy="22">core Express API — tenant isolation,</tspan><tspan x="73" dy="22">auth and visibility rules.</tspan></text>
    </g><g class="up" style="animation-delay:0.27s">
      <rect x="435" y="30" width="360" height="190" rx="16" fill="#0B1226" fill-opacity=".85" stroke="#1E293B"/>
      <rect x="435" y="30" width="360" height="190" rx="16" fill="none" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="140 1100" stroke-linecap="round" opacity=".9">
        <animate attributeName="stroke-dashoffset" from="180" to="-1060" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="463" y="56" width="52" height="40" rx="10" fill="#3B82F6" fill-opacity=".12" stroke="#3B82F6" stroke-opacity=".5"/>
      <text x="489" y="81" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3B82F6" text-anchor="middle">SQL</text>
      <text x="531" y="82" font-size="20" font-weight="700" fill="#E2E8F0">Data Layer</text>
      <text x="463" y="134" font-size="15" fill="#94A3B8"><tspan x="463" dy="0">PostgreSQL schema, PostgREST views</tspan><tspan x="463" dy="22">and migrations — query performance</tspan><tspan x="463" dy="22">and reversible rollouts.</tspan></text>
    </g><g class="up" style="animation-delay:0.39s">
      <rect x="825" y="30" width="360" height="190" rx="16" fill="#0B1226" fill-opacity=".85" stroke="#1E293B"/>
      <rect x="825" y="30" width="360" height="190" rx="16" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="140 1100" stroke-linecap="round" opacity=".9">
        <animate attributeName="stroke-dashoffset" from="360" to="-880" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="853" y="56" width="52" height="40" rx="10" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".5"/>
      <text x="879" y="81" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="middle">&lt;/&gt;</text>
      <text x="921" y="82" font-size="20" font-weight="700" fill="#E2E8F0">ERP Frontend</text>
      <text x="853" y="134" font-size="15" fill="#94A3B8"><tspan x="853" dy="0">EIOS web app on Next.js, React and</tspan><tspan x="853" dy="22">TypeScript — workflows, boards and</tspan><tspan x="853" dy="22">operator dashboards.</tspan></text>
    </g><g class="up" style="animation-delay:0.51s">
      <rect x="45" y="250" width="360" height="190" rx="16" fill="#0B1226" fill-opacity=".85" stroke="#1E293B"/>
      <rect x="45" y="250" width="360" height="190" rx="16" fill="none" stroke="#34D399" stroke-width="1.6" stroke-dasharray="140 1100" stroke-linecap="round" opacity=".9">
        <animate attributeName="stroke-dashoffset" from="540" to="-700" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="73" y="276" width="52" height="40" rx="10" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".5"/>
      <text x="99" y="301" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">CMS</text>
      <text x="141" y="302" font-size="20" font-weight="700" fill="#E2E8F0">Content Platform</text>
      <text x="73" y="354" font-size="15" fill="#94A3B8"><tspan x="73" dy="0">Headless CMS admin and page</tspan><tspan x="73" dy="22">renderer powering multi-brand</tspan><tspan x="73" dy="22">storefronts.</tspan></text>
    </g><g class="up" style="animation-delay:0.63s">
      <rect x="435" y="250" width="360" height="190" rx="16" fill="#0B1226" fill-opacity=".85" stroke="#1E293B"/>
      <rect x="435" y="250" width="360" height="190" rx="16" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="140 1100" stroke-linecap="round" opacity=".9">
        <animate attributeName="stroke-dashoffset" from="720" to="-520" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="463" y="276" width="52" height="40" rx="10" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".5"/>
      <text x="489" y="301" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22D3EE" text-anchor="middle">AI</text>
      <text x="531" y="302" font-size="20" font-weight="700" fill="#E2E8F0">Automation &amp; AI</text>
      <text x="463" y="354" font-size="15" fill="#94A3B8"><tspan x="463" dy="0">Scheduled jobs, background</tspan><tspan x="463" dy="22">processing and AI-assisted</tspan><tspan x="463" dy="22">engineering workflows.</tspan></text>
    </g><g class="up" style="animation-delay:0.75s">
      <rect x="825" y="250" width="360" height="190" rx="16" fill="#0B1226" fill-opacity=".85" stroke="#1E293B"/>
      <rect x="825" y="250" width="360" height="190" rx="16" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="140 1100" stroke-linecap="round" opacity=".9">
        <animate attributeName="stroke-dashoffset" from="900" to="-340" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="853" y="276" width="52" height="40" rx="10" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".5"/>
      <text x="879" y="301" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="middle">QA</text>
      <text x="921" y="302" font-size="20" font-weight="700" fill="#E2E8F0">Release Quality</text>
      <text x="853" y="354" font-size="15" fill="#94A3B8"><tspan x="853" dy="0">Code review, impact analysis,</tspan><tspan x="853" dy="22">staging verification and linear</tspan><tspan x="853" dy="22">release management.</tspan></text>
    </g>
</g>
<rect x=".5" y=".5" width="1199" height="469" rx="22" fill="none" stroke="#1E293B"/>
</svg>
