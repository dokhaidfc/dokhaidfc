name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#3B82F6&color_dots=#ebedf0,#c7d2fe,#93c5fd,#3b82f6,#1d4ed8
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161b22,#0c3b4a,#0e7490,#06b6d4,#67e8f9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
